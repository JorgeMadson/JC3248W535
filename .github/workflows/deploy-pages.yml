name: Build firmware e publicar o gravador (GitHub Pages)

# Compila o firmware do placar-mesa com PlatformIO, monta o site do gravador
# (com os binários + a cópia de fábrica) e publica no GitHub Pages.

on:
  push:
    branches: [main, master]
    paths:
      - "site/**"
      - "placar-mesa/**"
      - "backup/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Por padrão, só leitura. As permissões de publicação ficam apenas no job
# deploy, que não roda código de terceiros (pip/PlatformIO/bibliotecas).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions fixadas por SHA (a tag pode ser movida; o SHA não).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Compilar firmware do placar-mesa
        env:
          # A ini do projeto aponta o build para um caminho do Windows
          # (limite de 260 caracteres). No runner Linux, sobrescrevemos:
          PLATFORMIO_BUILD_DIR: ${{ github.workspace }}/.pio-build
          PLATFORMIO_LIBDEPS_DIR: ${{ github.workspace }}/.pio-libdeps
        run: |
          cd placar-mesa
          pio run -e jc3248w535

      - name: Montar o site (_site) com os binários
        run: |
          set -e
          DEST=_site
          FW="$DEST/firmwares/placar-mesa"

          # Caminhos exatos: o build_dir vem de PLATFORMIO_BUILD_DIR (passo
          # anterior) e o boot_app0 do framework Arduino fixado pela ini.
          BUILD="$GITHUB_WORKSPACE/.pio-build/jc3248w535"
          BOOTLOADER="$BUILD/bootloader.bin"
          PARTITIONS="$BUILD/partitions.bin"
          FIRMWARE="$BUILD/firmware.bin"
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"

          echo "bootloader : $BOOTLOADER"
          echo "partitions : $PARTITIONS"
          echo "firmware   : $FIRMWARE"
          echo "boot_app0  : $BOOT_APP0"
          for f in "$BOOTLOADER" "$PARTITIONS" "$FIRMWARE" "$BOOT_APP0"; do
            if [ -z "$f" ] || [ ! -f "$f" ]; then
              echo "ERRO: binário não encontrado — build falhou?"; exit 1
            fi
          done

          # 1) site estático
          cp -r site "$DEST"
          rm -f "$DEST/servir_local.py"   # helper só de teste local
          touch "$DEST/.nojekyll"
          # 2) firmware do placar-mesa (partes nos offsets do manifest)
          cp "$BOOTLOADER" "$FW/bootloader.bin"
          cp "$PARTITIONS" "$FW/partitions.bin"
          cp "$FIRMWARE"   "$FW/firmware.bin"
          cp "$BOOT_APP0"  "$FW/boot_app0.bin"
          # 3) cópia de fábrica
          cp backup/jc3248w535_fabrica_16MB.bin "$DEST/firmwares/fabrica/jc3248w535_fabrica_16MB.bin"
          # 4) SHA-256 de cada binário (o site mostra para conferência)
          for d in "$DEST"/firmwares/*/; do
            (cd "$d" && sha256sum *.bin > SHA256SUMS.txt)
          done
          cat "$DEST"/firmwares/*/SHA256SUMS.txt

          echo "== conteúdo publicado =="
          find "$DEST" -maxdepth 3 -type f | sort
          echo "== binários do placar =="
          ls -la "$FW"/*.bin

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
