; Carregador com tela para a placa JC3248W535
; Mostra a tensão da bateria no P5 enquanto o carregador da placa carrega.
;
;   pio run -t upload        -> compila e grava
;   pio device monitor       -> leituras pela serial
;
; No Windows, troque as portas por COM3.

[env:jc3248w535]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9

upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:49:B7:1C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:49:B7:1C-if00
monitor_speed = 115200
upload_speed = 921600
