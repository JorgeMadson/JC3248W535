; Freedoom (motor do Doom) na placa JC3248W535
; (ESP32-S3, tela touch 3.5" 320x480, AXS15231B via QSPI, som I2S, microSD)
;
;   pio run -t upload          -> compila e grava o programa
;   pio run -t gravar_wad      -> grava o episódio 1 na flash (reserva sem cartão)
;   pio device monitor         -> mensagens do jogo pela serial
;
; O jogo completo vai no microSD: copie o freedoom1.wad para a raiz do cartão.
; No Windows, troque as portas por COM3.

[platformio]
default_envs = jc3248w535

[env:jc3248w535]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = particoes.csv

build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFEATURE_SOUND
    -Isrc
    -Isrc/comum

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9

extra_scripts = scripts/gravar_wad.py

upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:49:B7:1C-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:49:B7:1C-if00
monitor_speed = 115200
upload_speed = 921600

; Testes no PC (motor do Doom sem hardware). No Deck: dentro do distrobox dev-gcc.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu11 -w -Wl,--wrap=fread
