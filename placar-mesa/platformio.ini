; Placar de mesa (vários jogos) para a placa JC3248W535
; (ESP32-S3, tela touch 3.5" 320x480, AXS15231B via QSPI)
;
;   python -m platformio run                 -> compila para a placa
;   python -m platformio run -t upload       -> grava na COM3
;   python -m platformio test -e native      -> testes da lógica no PC

[platformio]
; Caminho curto para evitar o limite de 260 caracteres do Windows
build_dir = C:/Users/filho/.rb/pm-build
libdeps_dir = C:/Users/filho/.rb/pm-libdeps
default_envs = jc3248w535

[env:jc3248w535]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Isrc/hal
    -Isrc/ui
    -Isrc/telas
    -Isrc/jogos

; U8g2 só fornece as fontes lisas (a GFX ativa o suporte quando acha U8g2lib.h)
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
    olikraus/U8g2@2.36.18
    Preferences
    Wire

upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 921600

; Testes da lógica pura (lib/nucleo) no PC, com Unity
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
extra_scripts = scripts/linkar_estatico.py
