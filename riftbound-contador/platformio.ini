; Contador de pontos Riftbound para a placa JC3248W535 (ESP32-S3, tela 3.5" AXS15231B)

; Caminho curto para evitar o limite de 260 caracteres do Windows
[platformio]
build_dir = C:/Users/filho/.rb/build
libdeps_dir = C:/Users/filho/.rb/libdeps

[env:jc3248w535]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@1.4.9

upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
upload_speed = 921600
